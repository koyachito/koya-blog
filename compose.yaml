services: 
  postgres:
    image: postgres:16-alpine
    container_name: postgres16
    restart: always
    environment:
      POSTGRES_USER: koyachito
      POSTGRES_PASSWORD: koyablog
      POSTGRES_DB: blog-db
    ports: 
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data

volumes: 
  postgres_data: